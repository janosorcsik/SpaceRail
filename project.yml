name: SpaceRail
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  bundleIdPrefix: com.janosorcsik
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0

targets:
  SpaceRail:
    type: application
    platform: macOS
    sources:
      - path: SpaceRail
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: SpaceRail/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Menu bar app: no Dock icon, no ⌘-tab entry, stays .accessory so it can own windows.
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: SpaceRail
        PRODUCT_BUNDLE_IDENTIFIER: com.janosorcsik.SpaceRail
      configs:
        # The dev build runs next to the installed one: own name, bundle ID, TCC grant, defaults
        # and state directory (see AppProfile).
        Debug:
          PRODUCT_NAME: SpaceRail Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.janosorcsik.SpaceRail.debug
    postBuildScripts:
      - name: Strip unused localizations
        basedOnDependencyAnalysis: false
        script: |
          res="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          [ -d "$res" ] || exit 0
          find "$res" -type d -name '*.lproj' | while read -r d; do
            keep=0
            for l in $KEEP_LOCALIZATIONS; do [ "$(basename "$d")" = "$l.lproj" ] && keep=1; done
            [ "$keep" = 1 ] || rm -rf "$d"
          done
    scheme:
      testTargets: [SpaceRailTests]
      gatherCoverageData: false

  # No host app: running the tests must not launch SpaceRail (it would ask for Accessibility and
  # start moving windows). The model and geometry sources are compiled straight into the bundle.
  SpaceRailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpaceRailTests
      - path: SpaceRail/Models/WorkspaceState.swift
      - path: SpaceRail/Models/Shortcuts.swift
      - path: SpaceRail/Services/StateStore.swift
      - path: SpaceRail/Models/AppProfile.swift
      - path: SpaceRail/Platform/AXWindow.swift
      - path: SpaceRail/Platform/Screens.swift
      - path: SpaceRail/Platform/Log.swift
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.janosorcsik.SpaceRailTests
        GENERATE_INFOPLIST_FILE: YES
